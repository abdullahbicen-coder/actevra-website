<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>.bg{fill:#10151c}.bar{fill:#171e27}.dot{fill:#596575}.title{fill:#f7f9fb;font:600 22px Arial}.kick{fill:#2563eb;font:700 12px Arial;letter-spacing:2px}.code{fill:#d8dee9;font:17px 'Courier New',monospace}.ln{fill:#596575}.foot{fill:#778493;font:12px Arial}</style><rect class="bg" width="1200" height="620" rx="18"/><rect class="bar" width="1200" height="92" rx="18"/><circle class="dot" cx="35" cy="34" r="6"/><circle class="dot" cx="57" cy="34" r="6"/><circle class="dot" cx="79" cy="34" r="6"/><text x="110" y="40" class="title">PackML State Transition</text><text x="110" y="66" class="kick">TWINCAT 3 · STRUCTURED TEXT</text><text x="54" y="150" class="code"><tspan class="ln">01</tspan><tspan dx="24">eNextState := eUnitState;</tspan></text><text x="54" y="178" class="code"><tspan class="ln">02</tspan><tspan dx="24">IF bSafetyAbort OR _bFatalLatched THEN</tspan></text><text x="54" y="206" class="code"><tspan class="ln">03</tspan><tspan dx="24">    CASE eUnitState OF</tspan></text><text x="54" y="234" class="code"><tspan class="ln">04</tspan><tspan dx="24">        E_PMLState.Aborting, E_PMLState.Aborted:</tspan></text><text x="54" y="262" class="code"><tspan class="ln">05</tspan><tspan dx="24">            // stable abort path</tspan></text><text x="54" y="290" class="code"><tspan class="ln">06</tspan><tspan dx="24">    ELSE</tspan></text><text x="54" y="318" class="code"><tspan class="ln">07</tspan><tspan dx="24">        eNextState := E_PMLState.Aborting;</tspan></text><text x="54" y="346" class="code"><tspan class="ln">08</tspan><tspan dx="24">        RETURN;</tspan></text><text x="54" y="374" class="code"><tspan class="ln">09</tspan><tspan dx="24">    END_CASE</tspan></text><text x="54" y="402" class="code"><tspan class="ln">10</tspan><tspan dx="24">END_IF</tspan></text><text x="54" y="430" class="code"><tspan class="ln">11</tspan><tspan dx="24"></tspan></text><text x="54" y="458" class="code"><tspan class="ln">12</tspan><tspan dx="24">CASE eUnitState OF</tspan></text><text x="54" y="486" class="code"><tspan class="ln">13</tspan><tspan dx="24">    E_PMLState.Idle:</tspan></text><text x="54" y="514" class="code"><tspan class="ln">14</tspan><tspan dx="24">        IF eCommand = E_PackMLCommand.Start THEN</tspan></text><text x="54" y="542" class="code"><tspan class="ln">15</tspan><tspan dx="24">            eNextState := E_PMLState.Starting;</tspan></text><text x="54" y="570" class="code"><tspan class="ln">16</tspan><tspan dx="24">        END_IF</tspan></text><text x="54" y="598" class="code"><tspan class="ln">17</tspan><tspan dx="24">    E_PMLState.Execute:</tspan></text><text x="54" y="626" class="code"><tspan class="ln">18</tspan><tspan dx="24">        CASE eCommand OF</tspan></text><text x="54" y="654" class="code"><tspan class="ln">19</tspan><tspan dx="24">            E_PackMLCommand.Hold: eNextState := E_PMLState.Holding;</tspan></text><text x="54" y="682" class="code"><tspan class="ln">20</tspan><tspan dx="24">            E_PackMLCommand.Stop: eNextState := E_PMLState.Stopping;</tspan></text><text x="54" y="590" class="foot">ACTEVRA ENGINEERING · REAL PROJECT CODE · SELECTED EXCERPT</text></svg>