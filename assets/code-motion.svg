<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>.bg{fill:#10151c}.bar{fill:#171e27}.dot{fill:#596575}.title{fill:#f7f9fb;font:600 22px Arial}.kick{fill:#10b981;font:700 12px Arial;letter-spacing:2px}.code{fill:#d8dee9;font:17px 'Courier New',monospace}.ln{fill:#596575}.foot{fill:#778493;font:12px Arial}</style><rect class="bg" width="1200" height="620" rx="18"/><rect class="bar" width="1200" height="92" rx="18"/><circle class="dot" cx="35" cy="34" r="6"/><circle class="dot" cx="57" cy="34" r="6"/><circle class="dot" cx="79" cy="34" r="6"/><text x="110" y="40" class="title">Servo Press Sequence</text><text x="110" y="66" class="kick">MOTION · STATE MACHINE</text><text x="54" y="150" class="code"><tspan class="ln">01</tspan><tspan dx="24">CASE miState OF</tspan></text><text x="54" y="178" class="code"><tspan class="ln">02</tspan><tspan dx="24">    STATE_0:</tspan></text><text x="54" y="206" class="code"><tspan class="ln">03</tspan><tspan dx="24">        IF PressActions.DrivesReadyWaitTime.Q AND</tspan></text><text x="54" y="234" class="code"><tspan class="ln">04</tspan><tspan dx="24">           PressServoActionsRight.AxIsCoupled THEN</tspan></text><text x="54" y="262" class="code"><tspan class="ln">05</tspan><tspan dx="24">            PressServoActionsLeft.Position :=</tspan></text><text x="54" y="290" class="code"><tspan class="ln">06</tspan><tspan dx="24">                ProdPar.MotorSpindle_StrokeDownPos;</tspan></text><text x="54" y="318" class="code"><tspan class="ln">07</tspan><tspan dx="24">            PressServoActionsLeft.StartAbsolute := TRUE;</tspan></text><text x="54" y="346" class="code"><tspan class="ln">08</tspan><tspan dx="24">            miState := STATE_1;</tspan></text><text x="54" y="374" class="code"><tspan class="ln">09</tspan><tspan dx="24">            RETURN;</tspan></text><text x="54" y="402" class="code"><tspan class="ln">10</tspan><tspan dx="24">        END_IF;</tspan></text><text x="54" y="430" class="code"><tspan class="ln">11</tspan><tspan dx="24"></tspan></text><text x="54" y="458" class="code"><tspan class="ln">12</tspan><tspan dx="24">    STATE_1:</tspan></text><text x="54" y="486" class="code"><tspan class="ln">13</tspan><tspan dx="24">        IF PressServoActionsLeft.MCMoveAbsolute.Error THEN</tspan></text><text x="54" y="514" class="code"><tspan class="ln">14</tspan><tspan dx="24">            PressServoActionsLeft.StartAbsolute := FALSE;</tspan></text><text x="54" y="542" class="code"><tspan class="ln">15</tspan><tspan dx="24">            PressServoActionsLeft.AxHasError := TRUE;</tspan></text><text x="54" y="570" class="code"><tspan class="ln">16</tspan><tspan dx="24">            miState := STATE_5;</tspan></text><text x="54" y="598" class="code"><tspan class="ln">17</tspan><tspan dx="24">        END_IF;</tspan></text><text x="54" y="590" class="foot">ACTEVRA ENGINEERING · REAL PROJECT CODE · SELECTED EXCERPT</text></svg>