<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.bg{fill:#10151c}.bar{fill:#171e27}.dot{fill:#596575}.title{fill:#f7f9fb;font:600 22px Arial}.kick{fill:#10b981;font:700 12px Arial;letter-spacing:2px}.code{fill:#d8dee9;font:17px 'Courier New',monospace}.ln{fill:#596575}.foot{fill:#778493;font:12px Arial}</style><rect class="bg" width="1200" height="650" rx="18"/><rect class="bar" width="1200" height="92" rx="18"/><circle class="dot" cx="35" cy="34" r="6"/><circle class="dot" cx="57" cy="34" r="6"/><circle class="dot" cx="79" cy="34" r="6"/><text x="110" y="40" class="title">TwinCAT Axis Reset &amp; Enable</text><text x="110" y="66" class="kick">MOTION · PACKML · STATE MACHINE</text><text x="54" y="150" class="code"><tspan class="ln">01</tspan><tspan dx="24">CASE iStateClearing OF</tspan></text><text x="54" y="175" class="code"><tspan class="ln">02</tspan><tspan dx="24">    0:</tspan></text><text x="54" y="200" class="code"><tspan class="ln">03</tspan><tspan dx="24">        stAxis.Admin.Reset.Execute := TRUE;</tspan></text><text x="54" y="225" class="code"><tspan class="ln">04</tspan><tspan dx="24">        IF stAxis.Admin.Reset.Done THEN</tspan></text><text x="54" y="250" class="code"><tspan class="ln">05</tspan><tspan dx="24">            stAxis.Admin.Reset.Execute := FALSE;</tspan></text><text x="54" y="275" class="code"><tspan class="ln">06</tspan><tspan dx="24">            iStateClearing := 1;</tspan></text><text x="54" y="300" class="code"><tspan class="ln">07</tspan><tspan dx="24">        END_IF</tspan></text><text x="54" y="325" class="code"><tspan class="ln">08</tspan><tspan dx="24">        stAxis.Admin.ResetDriver.Execute := TRUE;</tspan></text><text x="54" y="350" class="code"><tspan class="ln">09</tspan><tspan dx="24">    1:</tspan></text><text x="54" y="375" class="code"><tspan class="ln">10</tspan><tspan dx="24">        stAxis.Admin.Power.BufferMode := MC_Aborting;</tspan></text><text x="54" y="400" class="co